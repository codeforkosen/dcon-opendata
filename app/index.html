<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><link rel="icon" href="data:">
<title>DCON作品検索</title>
<link rel="stylesheet" href="style.css">
</head><body>
<header>
<h1>DCON作品検索</h1>
<input id=infilter placeholder="フィルタ">
</header>

<div id=main></div>

<script type="module">
import { CSV } from "https://code4fukui.github.io/CSV/CSV.js";
import { shuffle } from "https://js.sabae.cc/shuffle.js";

const teams = await CSV.fetchJSON("../data/team.csv");
//console.log(teams.map(i => i.ID));
const tosort = id => {
  const ss = id.split("_");
  const year = parseInt(ss[0].substring(4));
  const num = parseInt(ss[1]);
  return year * 100 - num;
};
teams.sort((a, b) => tosort(b.ID) - tosort(a.ID));
//teams.reverse();
//shuffle(teams);

const isMatch = (obj, key) => {
  key = key.toLowerCase();
  const isMatch2 = (obj) => {
    for (const name in obj) {
      const val = obj[name];
      if (typeof val == "object") {
        return isMatch2(val);
      } else if (val != null && val.toString().toLowerCase().indexOf(key) >= 0) {
        return true;
      }
    }
    return false;
  };
  return isMatch2(obj);
};

const show = () => {
  const key = infilter.value;

  main.innerHTML = "";
  for (const team of teams) {
    if (!isMatch(team, key)) continue;
    const a = document.createElement("a");
    const img = new Image();
    img.src = team.作品画像URL;
    a.appendChild(img);
    const div2 = document.createElement("div");
    a.appendChild(div2);
    const presen = team.プレゼンURL ? ` (<a href=${team.プレゼンURL} target=_blank>動画</a>)` : "";
    div2.innerHTML = `<div>${team.作品名}(${team.ID}) / ${team.高専}${presen}</div>`;
    a.setAttribute("href", team.URL);
    main.appendChild(a);
  }
};
infilter.oninput = () => show();
show();
</script>

<footer>

</footer>

</body>
</html>
